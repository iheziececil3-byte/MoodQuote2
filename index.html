<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoodQuote - Quotes Matching How You Feel</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Header Section -->
    <header class="app-header">
      <div class="logo-badge" aria-hidden="true">💭</div>
      <h1 class="app-title">MoodQuote</h1>
      <p class="app-tagline">Find a quote that matches how you feel</p>
    </header>

    <!-- Mood Selector Section -->
    <section class="mood-section" aria-labelledby="mood-section-heading">
      <h2 id="mood-section-heading" class="section-title">How are you feeling right now?</h2>
      <div class="mood-buttons-grid" role="group" aria-label="Mood selection options">
        <button type="button" class="mood-btn" data-mood="happy">
          <span class="mood-emoji" aria-hidden="true">😊</span>
          <span class="mood-label">Happy</span>
        </button>
        <button type="button" class="mood-btn" data-mood="calm">
          <span class="mood-emoji" aria-hidden="true">🌿</span>
          <span class="mood-label">Calm</span>
        </button>
        <button type="button" class="mood-btn" data-mood="motivated">
          <span class="mood-emoji" aria-hidden="true">🔥</span>
          <span class="mood-label">Motivated</span>
        </button>
        <button type="button" class="mood-btn" data-mood="sad">
          <span class="mood-emoji" aria-hidden="true">🌧️</span>
          <span class="mood-label">Sad</span>
        </button>
        <button type="button" class="mood-btn" data-mood="anxious">
          <span class="mood-emoji" aria-hidden="true">🌊</span>
          <span class="mood-label">Anxious</span>
        </button>
        <button type="button" class="mood-btn" data-mood="grateful">
          <span class="mood-emoji" aria-hidden="true">✨</span>
          <span class="mood-label">Grateful</span>
        </button>
      </div>
    </section>

    <!-- Quote Display Card Section -->
    <main class="quote-container">
      <div class="quote-card" id="quoteCard">
        <!-- Default Neutral Welcome State -->
        <div class="welcome-state" id="welcomeState">
          <div class="welcome-icon" aria-hidden="true">✨</div>
          <p class="welcome-message">Pick a mood to get started</p>
        </div>
      </div>

      <!-- Action Controls -->
      <div class="controls-container">
        <button type="button" id="newQuoteBtn" class="btn-new-quote" disabled aria-disabled="true">
          <svg class="btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
          </svg>
          <span>New Quote</span>
        </button>
      </div>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <p>MoodQuote &bull; Instant inspiration tailored to your emotion</p>
    </footer>
  </div>

  <!-- JavaScript -->
  <script src="script.js"></script>
</body>
</html>
